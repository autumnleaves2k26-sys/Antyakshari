kind = "web"
previewPath = "/"
title = "Antyakshari - Event Registration"
version = "1.0.0"
id = "artifacts/antyakshari"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22754

[services.development]
run = "pnpm --filter @workspace/antyakshari run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/antyakshari", "run", "build" ]
publicDir = "artifacts/antyakshari/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22754"
BASE_PATH = "/"
